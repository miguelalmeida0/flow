name: Companion credential boundary

on:
  push:
    branches: [test]
    paths:
      - server/desktop-bridge/**
      - scripts/security/companion-output.test.mjs
      - .github/workflows/companion-security.yml
  pull_request:
    branches: [test]
    paths:
      - server/desktop-bridge/**
      - scripts/security/companion-output.test.mjs
      - .github/workflows/companion-security.yml

permissions:
  contents: read

concurrency:
  group: companion-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify private pairing file and secret-free output
        run: node --test scripts/security/companion-output.test.mjs
