name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FLOW_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Unit and semantic corpus
        run: npm run test:run
      - name: Server behavior
        if: ${{ !cancelled() }}
        run: npm run test:server
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

  browser:
    name: Browser behavior
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build browser candidate
        id: build
        run: npm run build
      - name: Run Playwright behavior suite
        env:
          FLOW_RELEASE_QA: "1"
          FLOW_E2E_PORT: "5318"
        run: npx playwright test
      - name: Development StrictMode lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright test --config=playwright.dev.config.ts
      - name: Motion and compositor behavior
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright test --config=playwright.motion.config.ts
      - name: Save failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: flow-browser-evidence
          path: |
            test-results/
            artifacts/
          if-no-files-found: ignore
          retention-days: 14

  release-evidence:
    name: Deep release evidence
    if: ${{ github.event_name != 'pull_request' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Flow release QA
        run: npm run qa:release
      - name: Preserve release evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: flow-release-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
