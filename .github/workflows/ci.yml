name: Flow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.0"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright

jobs:
  baseline:
    name: Baseline test inventory
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Capture baseline Vitest report
        shell: bash
        run: |
          mkdir -p artifacts/ci node_modules/.tmp
          set +e
          TMPDIR="$PWD/node_modules/.tmp" npx --no-install vitest run             --maxWorkers=1             --reporter=json             --outputFile=artifacts/ci/vitest.json
          code=$?
          set -e
          printf '%s\n' "$code" > artifacts/ci/exit-code.txt
          test -s artifacts/ci/vitest.json

      - uses: actions/upload-artifact@v4
        with:
          name: flow-baseline-tests
          path: artifacts/ci/
          retention-days: 7

  candidate:
    name: Candidate quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Capture candidate Vitest report
        shell: bash
        run: |
          mkdir -p artifacts/ci node_modules/.tmp
          set +e
          TMPDIR="$PWD/node_modules/.tmp" npx --no-install vitest run             --maxWorkers=1             --reporter=json             --outputFile=artifacts/ci/vitest.json
          code=$?
          set -e
          printf '%s\n' "$code" > artifacts/ci/exit-code.txt
          test -s artifacts/ci/vitest.json

      - name: Record semantic corpus
        run: node scripts/qa-release.mjs --semantic-count-only > artifacts/ci/semantic-corpus.json

      - name: Production build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-candidate-tests
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser journeys
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-browser-evidence
          path: |
            test-results/
            playwright-report/
            artifacts/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

  deterministic:
    name: Deterministic gates
    if: always()
    needs: [baseline, candidate, browser, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Require supporting lanes
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          BASELINE_RESULT: ${{ needs.baseline.result }}
        run: |
          test "$BASELINE_RESULT" = "success"
          test "$CANDIDATE_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"

      - uses: actions/download-artifact@v4
        with:
          name: flow-baseline-tests
          path: artifacts/ci/base

      - uses: actions/download-artifact@v4
        with:
          name: flow-candidate-tests
          path: artifacts/ci/head

      - name: Block new test failures
        run: node scripts/ci/compare-vitest-ratchet.mjs artifacts/ci/base/vitest.json artifacts/ci/head/vitest.json
