name: Hosted release qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FLOW_TEST_REDIS_URL: redis://127.0.0.1:6379
      FLOW_RELEASE_EVIDENCE_DIR: artifacts/hosted-release/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-hosted-release-checks.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: hosted-deterministic-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/hosted-release/ci/
          if-no-files-found: error
          retention-days: 14
  # No credentialed provider job is enabled. Staging approval, bounded spending,
  # protected credentials, safe evidence allowlist and immutable digest binding
  # must be supplied before a separate live qualification can run.
